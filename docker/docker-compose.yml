services:
  mysql:
    image: mysql:8.0
    container_name: mqtt-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-mqtt_cloud}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - mqtt-network

  redis:
    image: redis:7-alpine
    container_name: mqtt-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      # 仅绑本机：Redis 无 TLS，不对外暴露；后端与 emqx-init 走容器网络直连
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - mqtt-network

  # 说明：EMQX 5 默认不启用认证，认证与授权由 emqx-init 服务通过 REST API 下发：
  # 认证/授权均回调后端 /api/internal/emqx/**，由后端按产品-设备-一机一密规则裁决。
  emqx:
    # 必须写完整补丁号：Docker Hub 上不存在 `emqx/emqx:5.0` 这个 tag（只有 5.0.0~5.0.26），
    # 写成 5.0 时本地因已有回填镜像可跑通，但 CI/新机器 pull 会 404（R4-5 首次远程运行发现）。
    image: emqx/emqx:5.0.26
    container_name: mqtt-emqx
    restart: always
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      # T-25：X.509 认证必须走 TLS，客户端证书只能在 TLS 握手阶段提交
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      # 必须与 emqx-init 登录所用凭据一致，否则初始化脚本会 401。
      # EMQX 仅在 mnesia 为空（首次初始化）时应用该默认密码；已有数据卷不会被改写。
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # ── TLS 监听器（T-25 认证方式扩展） ──
      # EMQX 5 默认已在 8883 启用 ssl 监听器，此处显式声明便于按需关闭。
      EMQX_LISTENERS__SSL__DEFAULT__ENABLE: ${MQTT_TLS_ENABLED:-true}
      # 证书路径默认取镜像自带的演示证书，容器可原样启动；
      # 生产部署须改为 etc/mqtt-certs/ 下由 ./certs 挂载进来的自有证书（见 docs/DEPLOYMENT.md）。
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: ${MQTT_TLS_CERTFILE:-etc/certs/cert.pem}
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: ${MQTT_TLS_KEYFILE:-etc/certs/key.pem}
      # 受信 CA 链：verify_peer 下用它校验证书链，X.509 认证时还须与设备证书的签发 CA 一致
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: ${MQTT_TLS_CACERTFILE:-etc/certs/cacert.pem}
      # verify_peer 才会向客户端索要证书，${cert_subject}/${cert_common_name} 才非空；
      # 置 verify_peer 但 fail_if_no_peer_cert=false，使 SECRET/JWT 设备不带证书也能接入。
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: ${MQTT_TLS_VERIFY:-verify_peer}
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "false"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      # 自有服务端证书与 CA 链的投放入口；目录缺失时 Docker 会建空目录，
      # 此时上面三个路径仍指向镜像自带演示证书，容器不会因此启动失败。
      - ./certs:/opt/emqx/etc/mqtt-certs:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - mqtt-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: mqtt-cloud-backend:1.0.0
    restart: always
    stop_grace_period: 30s
    # 不设 container_name（会阻止 --scale），也不发布宿主机端口（多副本会端口冲突）；
    # 统一由 frontend(nginx) 作为唯一入口转发，容器间走 mqtt-network 直连。
    expose:
      - "8080"
    deploy:
      # 注意：compose 下 --scale backend=N 优先；此处仅为声明期望副本数与资源上限
      replicas: ${BACKEND_REPLICAS:-1}
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      DB_NAME: ${DB_NAME:-mqtt_cloud}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 与 application.yml 的 spring.mqtt.host 对应，必须为 tcp://host:port
      MQTT_HOST: tcp://emqx:1883
      # 后端自身连接 Broker 使用平台账号：用户名固定为 PLATFORM，密码为 PLATFORM_SECRET
      MQTT_USERNAME: PLATFORM
      MQTT_PASSWORD: ${PLATFORM_SECRET:?PLATFORM_SECRET 必须在 .env 中配置}
      MQTT_CLIENT_ID: mqtt_backend
      # 共享订阅组名：多副本必须一致，同一组内分摊消息避免重复落库
      MQTT_SHARED_GROUP: ${MQTT_SHARED_GROUP:-mqtt-backend}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须在 .env 中配置}
      # T-56 数据桥接（Kafka）：默认关闭；开启后规则 / 场景 FORWARD_KAFKA 出站
      BRIDGE_KAFKA_ENABLED: ${BRIDGE_KAFKA_ENABLED:-false}
      BRIDGE_KAFKA_BOOTSTRAP_SERVERS: ${BRIDGE_KAFKA_BOOTSTRAP_SERVERS:-}
      BRIDGE_KAFKA_TOPIC: ${BRIDGE_KAFKA_TOPIC:-}
      BRIDGE_KAFKA_CLIENT_ID: ${BRIDGE_KAFKA_CLIENT_ID:-mqtt-cloud-bridge}
      BRIDGE_KAFKA_ACKS: ${BRIDGE_KAFKA_ACKS:-all}
      BRIDGE_KAFKA_MAX_BLOCK_MS: ${BRIDGE_KAFKA_MAX_BLOCK_MS:-5000}
      BRIDGE_KAFKA_SECURITY_PROTOCOL: ${BRIDGE_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      BRIDGE_KAFKA_SASL_MECHANISM: ${BRIDGE_KAFKA_SASL_MECHANISM:-}
      BRIDGE_KAFKA_SASL_USERNAME: ${BRIDGE_KAFKA_SASL_USERNAME:-}
      BRIDGE_KAFKA_SASL_PASSWORD: ${BRIDGE_KAFKA_SASL_PASSWORD:-}
      # T-58 多因素认证（TOTP）：默认开启；关闭后 MFA 端点 404 且登录不要求二步验证
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_TIME_STEP_SECONDS: ${MFA_TIME_STEP_SECONDS:-30}
      MFA_ALLOWED_WINDOW: ${MFA_ALLOWED_WINDOW:-1}
      MFA_DIGITS: ${MFA_DIGITS:-6}
      MFA_SECRET_LENGTH: ${MFA_SECRET_LENGTH:-20}
      MFA_ISSUER: ${MFA_ISSUER:-MQTT云平台}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      SERVER_PORT: 8080
      # 激活生产 profile：覆盖 application.yml 中的 DEBUG 日志与全量 SQL 输出
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 接入访问控制（EMQX HTTP 回调）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN 必须在 .env 中配置}
      PLATFORM_SECRET: ${PLATFORM_SECRET:?PLATFORM_SECRET 必须在 .env 中配置}
      FRONTEND_SECRET: ${FRONTEND_SECRET:-}
      ACCESS_CONTROL_ENFORCE_AUTH: ${ACCESS_CONTROL_ENFORCE_AUTH:-false}
      DIRECT_FRONTEND_ENABLED: ${DIRECT_FRONTEND_ENABLED:-true}
      # 认证元数据缓存 TTL（秒）；0 关闭缓存，认证每次回源查库
      ACCESS_CONTROL_CACHE_TTL_SECONDS: ${ACCESS_CONTROL_CACHE_TTL_SECONDS:-60}
      # 开放接口限流（T-30 E4）：仅作用于 /external/v1/**。默认关闭；
      # 正式对外前应置true 并按实际配额调max-requests-per-window
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-600}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      # 健康检查阈值（T-30 E3）：超阈值 readiness 报 DOWN，交监控告警而非自动重启
      HEALTH_DEAD_LETTER_THRESHOLD: ${HEALTH_DEAD_LETTER_THRESHOLD:-1000}
      HEALTH_QUEUE_DEPTH_THRESHOLD: ${HEALTH_QUEUE_DEPTH_THRESHOLD:-5000}
      # 结构化日志落盘目录（T-30 E1），与 backend_logs 卷对应
      LOGGING_FILE_PATH: ${LOG_DIR:-/var/log/mqtt-cloud}
      # EMQX 管理面：禁用 / 停用时踢掉在线连接，凭据与 emqx-init 下发配置所用账号一致
      EMQX_API_BASE_URL: http://emqx:18083/api/v5
      EMQX_DASHBOARD_USER: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      EMQX_KICK_ENABLED: ${EMQX_KICK_ENABLED:-true}
      STREAM_TIMEOUT_MS: ${STREAM_TIMEOUT_MS:-1800000}
      STREAM_HEARTBEAT_INTERVAL_MS: ${STREAM_HEARTBEAT_INTERVAL_MS:-15000}
      # 实时通道跨副本广播：多副本必须置 true；单副本保持 false（本地扇出）
      REALTIME_BROADCAST_ENABLED: ${REALTIME_BROADCAST_ENABLED:-false}
      REALTIME_BROADCAST_CHANNEL: ${REALTIME_BROADCAST_CHANNEL:-mqtt:realtime:device-data}
      # 上行摄取管线开关；置 false 回退到同步处理（仅用于故障回滚，非长期运行形态）
      INGEST_ENABLED: ${INGEST_ENABLED:-true}
      # 停机排空摄取队列的最长等待（毫秒）。必须小于 stop_grace_period(30s)，
      # 否则容器会被强杀，未排空的消息来不及转死信。
      INGEST_SHUTDOWN_DRAIN_TIMEOUT_MS: ${INGEST_SHUTDOWN_DRAIN_TIMEOUT_MS:-10000}
      # 物模型上行解析开关（T-14）；置 false 时只落原始消息，解析链路整体退化为现状
      THING_MODEL_INTERPRET_ENABLED: ${THING_MODEL_INTERPRET_ENABLED:-true}
      # 物模型定义缓存 TTL（秒）；0 关闭缓存。保存只失效本副本，多副本收敛窗口 = 该 TTL
      THING_MODEL_CACHE_TTL_SECONDS: ${THING_MODEL_CACHE_TTL_SECONDS:-60}
      # 物模型 TSL 大小上限（字节），保存与导入共用
      THING_MODEL_MAX_SIZE_BYTES: ${THING_MODEL_MAX_SIZE_BYTES:-262144}
      # 命令下发与服务调用（T-15）：同步等待超时与轮询间隔（毫秒）
      COMMAND_SYNC_TIMEOUT_MS: ${COMMAND_SYNC_TIMEOUT_MS:-5000}
      COMMAND_POLL_INTERVAL_MS: ${COMMAND_POLL_INTERVAL_MS:-200}
      # 超时巡检间隔（毫秒），0 关闭；异步命令判定超时时长（毫秒）
      COMMAND_TIMEOUT_SWEEP_INTERVAL_MS: ${COMMAND_TIMEOUT_SWEEP_INTERVAL_MS:-30000}
      COMMAND_ASYNC_TIMEOUT_MS: ${COMMAND_ASYNC_TIMEOUT_MS:-60000}
      # 命令参数 JSON 大小上限（字节）
      COMMAND_MAX_PARAMS_BYTES: ${COMMAND_MAX_PARAMS_BYTES:-16384}
      COMMAND_DENIED_IDENTIFIERS: ${COMMAND_DENIED_IDENTIFIERS:-factory_reset}
      COMMAND_QUOTA_ENABLED: ${COMMAND_QUOTA_ENABLED:-false}
      COMMAND_QUOTA_WINDOW_SECONDS: ${COMMAND_QUOTA_WINDOW_SECONDS:-60}
      COMMAND_QUOTA_MAX_PER_WINDOW: ${COMMAND_QUOTA_MAX_PER_WINDOW:-600}
      COMMAND_QUOTA_SYNC_MULTIPLIER: ${COMMAND_QUOTA_SYNC_MULTIPLIER:-1}
      COMMAND_QUOTA_FAIL_OPEN: ${COMMAND_QUOTA_FAIL_OPEN:-true}
      # 设备影子与离线补发（T-16）：上线补发总开关与重试上限
      SHADOW_RESEND_ENABLED: ${SHADOW_RESEND_ENABLED:-true}
      SHADOW_RETRY_MAX_ATTEMPTS: ${SHADOW_RETRY_MAX_ATTEMPTS:-5}
      # 指数退避基数 / 封顶（毫秒）与巡检间隔（毫秒，0 关闭）
      SHADOW_RETRY_BASE_DELAY_MS: ${SHADOW_RETRY_BASE_DELAY_MS:-5000}
      SHADOW_RETRY_MAX_DELAY_MS: ${SHADOW_RETRY_MAX_DELAY_MS:-300000}
      SHADOW_RETRY_SWEEP_INTERVAL_MS: ${SHADOW_RETRY_SWEEP_INTERVAL_MS:-30000}
      # 单轮 / 单设备补发批量上限、影子 CAS 重试次数、QUEUED 过期时长（毫秒，0 不过期）
      SHADOW_RESEND_BATCH_SIZE: ${SHADOW_RESEND_BATCH_SIZE:-200}
      SHADOW_CAS_RETRY: ${SHADOW_CAS_RETRY:-3}
      SHADOW_QUEUE_TTL_MS: ${SHADOW_QUEUE_TTL_MS:-0}
      # 告警中心（T-17）：评估 / 通知总开关、抑制窗口与离线巡检
      ALERT_ENABLED: ${ALERT_ENABLED:-true}
      ALERT_NOTIFY_ENABLED: ${ALERT_NOTIFY_ENABLED:-true}
      ALERT_RECOVER_NOTIFY_ENABLED: ${ALERT_RECOVER_NOTIFY_ENABLED:-true}
      ALERT_SUPPRESS_WINDOW_SECONDS: ${ALERT_SUPPRESS_WINDOW_SECONDS:-300}
      ALERT_SWEEP_INTERVAL_MS: ${ALERT_SWEEP_INTERVAL_MS:-30000}
      ALERT_SWEEP_BATCH_SIZE: ${ALERT_SWEEP_BATCH_SIZE:-200}
      # 规则与告警作用域（T-28）：单条规则 / 告警作用域内分组或标签数量上限
      SCOPE_MAX_TARGETS: ${SCOPE_MAX_TARGETS:-50}
      # 消息规则 / 规则引擎（T-19）：总开关、缓存、执行线程池与失败重试巡检
      RULE_ENABLED: ${RULE_ENABLED:-true}
      RULE_MAX_RULES_PER_USER: ${RULE_MAX_RULES_PER_USER:-200}
      RULE_CACHE_TTL_SECONDS: ${RULE_CACHE_TTL_SECONDS:-60}
      RULE_EXECUTOR_CORE_SIZE: ${RULE_EXECUTOR_CORE_SIZE:-2}
      RULE_EXECUTOR_MAX_SIZE: ${RULE_EXECUTOR_MAX_SIZE:-8}
      RULE_EXECUTOR_QUEUE_CAPACITY: ${RULE_EXECUTOR_QUEUE_CAPACITY:-500}
      RULE_RETRY_MAX_ATTEMPTS: ${RULE_RETRY_MAX_ATTEMPTS:-3}
      RULE_RETRY_BASE_DELAY_MS: ${RULE_RETRY_BASE_DELAY_MS:-5000}
      RULE_RETRY_MAX_DELAY_MS: ${RULE_RETRY_MAX_DELAY_MS:-300000}
      RULE_SWEEP_INTERVAL_MS: ${RULE_SWEEP_INTERVAL_MS:-30000}
      RULE_SWEEP_BATCH_SIZE: ${RULE_SWEEP_BATCH_SIZE:-200}
      RULE_EXECUTION_RETENTION_DAYS: ${RULE_EXECUTION_RETENTION_DAYS:-30}
      RULE_HTTP_TIMEOUT_MS: ${RULE_HTTP_TIMEOUT_MS:-5000}
      RULE_HTTP_SECRET: ${RULE_HTTP_SECRET:-}
      RULE_MAX_PAYLOAD_BYTES: ${RULE_MAX_PAYLOAD_BYTES:-16384}
      # 外部 MQTT 转发（出站到第三方 Broker，不经自有 EMQX）；未配置第三方 Broker 请勿置 true
      RULE_MQTT_ENABLED: ${RULE_MQTT_ENABLED:-false}
      RULE_MQTT_BROKER_URL: ${RULE_MQTT_BROKER_URL:-}
      RULE_MQTT_CLIENT_ID: ${RULE_MQTT_CLIENT_ID:-mqtt-rule-forwarder}
      RULE_MQTT_USERNAME: ${RULE_MQTT_USERNAME:-}
      RULE_MQTT_PASSWORD: ${RULE_MQTT_PASSWORD:-}
      RULE_MQTT_QOS: ${RULE_MQTT_QOS:-1}
      RULE_MQTT_KEEPALIVE: ${RULE_MQTT_KEEPALIVE:-60}
      RULE_MQTT_CONNECT_TIMEOUT: ${RULE_MQTT_CONNECT_TIMEOUT:-10}
      # 属性时序与可视化（T-21）：历史落库开关、聚合查询上限与保留清理
      PROPERTY_HISTORY_ENABLED: ${PROPERTY_HISTORY_ENABLED:-true}
      PROPERTY_HISTORY_STREAM_ENABLED: ${PROPERTY_HISTORY_STREAM_ENABLED:-false}
      PROPERTY_HISTORY_MAX_RANGE_DAYS: ${PROPERTY_HISTORY_MAX_RANGE_DAYS:-31}
      PROPERTY_HISTORY_MAX_SERIES: ${PROPERTY_HISTORY_MAX_SERIES:-20}
      PROPERTY_HISTORY_MAX_POINTS: ${PROPERTY_HISTORY_MAX_POINTS:-500}
      # 历史保留天数（R5 门槛复核输入）；0 表示不清理
      PROPERTY_HISTORY_RETENTION_DAYS: ${PROPERTY_HISTORY_RETENTION_DAYS:-30}
      # 清理巡检：开关、间隔（毫秒，0 关闭）、单批删除行数
      PROPERTY_HISTORY_CLEANUP_ENABLED: ${PROPERTY_HISTORY_CLEANUP_ENABLED:-true}
      PROPERTY_HISTORY_CLEANUP_INTERVAL_MS: ${PROPERTY_HISTORY_CLEANUP_INTERVAL_MS:-3600000}
      PROPERTY_HISTORY_CLEANUP_BATCH_SIZE: ${PROPERTY_HISTORY_CLEANUP_BATCH_SIZE:-1000}
      # 可保存看板（T-21）：每用户看板数与单看板面板数上限
      DASHBOARD_MAX_COUNT: ${DASHBOARD_MAX_COUNT:-20}
      DASHBOARD_MAX_PANELS: ${DASHBOARD_MAX_PANELS:-12}
      # 看板分享（T-46）：分享数量 / 单分享看板数 / 轮播间隔上下限
      DASHBOARD_MAX_SHARES: ${DASHBOARD_MAX_SHARES:-20}
      DASHBOARD_MAX_SHARE_DASHBOARDS: ${DASHBOARD_MAX_SHARE_DASHBOARDS:-10}
      DASHBOARD_SHARE_INTERVAL_MIN_SECONDS: ${DASHBOARD_SHARE_INTERVAL_MIN_SECONDS:-5}
      DASHBOARD_SHARE_INTERVAL_MAX_SECONDS: ${DASHBOARD_SHARE_INTERVAL_MAX_SECONDS:-3600}
      # 设备拓扑（T-26 / T-47）：多级网关深度与单网关子设备上限
      DEVICE_TOPOLOGY_ENABLED: ${DEVICE_TOPOLOGY_ENABLED:-true}
      DEVICE_TOPOLOGY_MAX_DEPTH: ${DEVICE_TOPOLOGY_MAX_DEPTH:-5}
      DEVICE_TOPOLOGY_MAX_SUB_DEVICES_PER_GATEWAY: ${DEVICE_TOPOLOGY_MAX_SUB_DEVICES_PER_GATEWAY:-200}
      # 设备调试中心（T-37）：对外 Broker 地址与模拟上报上限。
      # DEBUG_PUBLIC_BROKER_HOST 必须是浏览器 / 上位机可达的域名或 IP，不能填容器名 emqx
      DEBUG_ENABLED: ${DEBUG_ENABLED:-true}
      DEBUG_PUBLIC_BROKER_HOST: ${DEBUG_PUBLIC_BROKER_HOST:-localhost}
      DEBUG_MQTT_WS_PATH: ${DEBUG_MQTT_WS_PATH:-/mqtt}
      DEBUG_MAX_PAYLOAD_BYTES: ${DEBUG_MAX_PAYLOAD_BYTES:-65536}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TLS_PORT: ${MQTT_TLS_PORT:-8883}
      MQTT_WS_PORT: ${MQTT_WS_PORT:-8083}
      # 快速上位机（T-38）：数量与单面板控件上限
      HMI_MAX_COUNT: ${HMI_MAX_COUNT:-20}
      HMI_MAX_WIDGETS: ${HMI_MAX_WIDGETS:-30}
      # 平台侧 Modbus 主站采集（T-31 P4）：默认关闭，确认现场网络可达后再开启
      MODBUS_COLLECT_ENABLED: ${MODBUS_COLLECT_ENABLED:-false}
      MODBUS_SWEEP_INTERVAL_MS: ${MODBUS_SWEEP_INTERVAL_MS:-1000}
      MODBUS_BATCH_LIMIT: ${MODBUS_BATCH_LIMIT:-200}
      MODBUS_ENABLED_DEVICE_LIMIT: ${MODBUS_ENABLED_DEVICE_LIMIT:-50}
      MODBUS_MAX_CONNECTIONS: ${MODBUS_MAX_CONNECTIONS:-8}
      MODBUS_CONNECT_TIMEOUT_MS: ${MODBUS_CONNECT_TIMEOUT_MS:-3000}
      MODBUS_READ_TIMEOUT_MS: ${MODBUS_READ_TIMEOUT_MS:-3000}
      MODBUS_RETRY: ${MODBUS_RETRY:-1}
      MODBUS_MIN_INTERVAL_MS: ${MODBUS_MIN_INTERVAL_MS:-1000}
      MODBUS_CORE_POOL_SIZE: ${MODBUS_CORE_POOL_SIZE:-2}
      MODBUS_MAX_POOL_SIZE: ${MODBUS_MAX_POOL_SIZE:-4}
      MODBUS_QUEUE_CAPACITY: ${MODBUS_QUEUE_CAPACITY:-200}
      MODBUS_DEFAULT_HOST: ${MODBUS_DEFAULT_HOST:-}
      MODBUS_DEFAULT_PORT: ${MODBUS_DEFAULT_PORT:-502}
      MODBUS_DEFAULT_UNIT_ID: ${MODBUS_DEFAULT_UNIT_ID:-1}
      # OTA 固件升级（T-22）：升级开关、存储目录、下载前缀与批次上限
      OTA_ENABLED: ${OTA_ENABLED:-true}
      OTA_STORAGE_DIR: ${OTA_STORAGE_DIR:-/var/lib/mqtt/ota}
      OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:-http://localhost/firmware}
      OTA_MAX_FILE_SIZE: ${OTA_MAX_FILE_SIZE:-33554432}
      OTA_TASK_MAX_DEVICES: ${OTA_TASK_MAX_DEVICES:-500}
      OTA_DISPATCH_INTERVAL_MS: ${OTA_DISPATCH_INTERVAL_MS:-60000}
      OTA_DISPATCH_BATCH_SIZE: ${OTA_DISPATCH_BATCH_SIZE:-200}
      OTA_TASK_TIMEOUT_MS: ${OTA_TASK_TIMEOUT_MS:-86400000}
      OTA_DEVICE_CONFLICT_POLICY: ${OTA_DEVICE_CONFLICT_POLICY:-SKIP}
      OTA_BATCH_INTERVAL_MS: ${OTA_BATCH_INTERVAL_MS:-0}
      OTA_BATCH_ADVANCE_BATCH_SIZE: ${OTA_BATCH_ADVANCE_BATCH_SIZE:-5}
      OTA_DEFAULT_BATCH_SIZE: ${OTA_DEFAULT_BATCH_SIZE:-10}
      OTA_VERIFY_REQUIRED: ${OTA_VERIFY_REQUIRED:-false}
      # T-54：默认拦截降级；现场回滚固件时置 true
      OTA_ALLOW_DOWNGRADE: ${OTA_ALLOW_DOWNGRADE:-false}
      # HTTP 上报（T-24 多协议接入）：端点与设备凭据过滤器总开关、单次载荷上限、Basic realm
      HTTP_INGEST_ENABLED: ${HTTP_INGEST_ENABLED:-true}
      HTTP_INGEST_MAX_PAYLOAD_BYTES: ${HTTP_INGEST_MAX_PAYLOAD_BYTES:-65536}
      HTTP_INGEST_REALM: ${HTTP_INGEST_REALM:-mqtt-cloud-device}
      # T-53 设备级限流与幂等：默认关闭限流，避免未配置环境被 429 打断
      HTTP_INGEST_RATE_LIMIT_ENABLED: ${HTTP_INGEST_RATE_LIMIT_ENABLED:-false}
      HTTP_INGEST_RATE_LIMIT_PER_MINUTE: ${HTTP_INGEST_RATE_LIMIT_PER_MINUTE:-600}
      HTTP_INGEST_RATE_LIMIT_FAIL_OPEN: ${HTTP_INGEST_RATE_LIMIT_FAIL_OPEN:-true}
      HTTP_INGEST_IDEMPOTENCY_TTL_SECONDS: ${HTTP_INGEST_IDEMPOTENCY_TTL_SECONDS:-300}
      # T-53 审计日志：记录写操作与认证事件，仅 ADMIN 查询；保留天数 0 表示不清理
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-180}
      AUDIT_LOG_SWEEP_INTERVAL_MS: ${AUDIT_LOG_SWEEP_INTERVAL_MS:-3600000}
      AUDIT_LOG_PURGE_BATCH_SIZE: ${AUDIT_LOG_PURGE_BATCH_SIZE:-1000}
      # T-53 设备 CSV 导入上限
      DEVICE_IMPORT_MAX_FILE_BYTES: ${DEVICE_IMPORT_MAX_FILE_BYTES:-2097152}
      DEVICE_IMPORT_MAX_ROWS: ${DEVICE_IMPORT_MAX_ROWS:-1000}
      # 认证方式扩展（T-25）：开关为 false 时，X.509 / JWT 产品无法签发凭据，
      # 存量 SECRET 设备不受影响；认证分派由后端按产品 auth_mode 决定，与开关无关。
      # CA 证书 / 私钥取 ./certs 挂载进容器后的文件路径；轮换 CA 会令已签发证书链校验失败。
      AUTH_X509_ENABLED: ${AUTH_X509_ENABLED:-false}
      AUTH_X509_CA_CERT: ${AUTH_X509_CA_CERT:-/etc/mqtt/certs/ca.crt}
      AUTH_X509_CA_KEY: ${AUTH_X509_CA_KEY:-/etc/mqtt/certs/ca.key}
      AUTH_X509_VALIDITY_DAYS: ${AUTH_X509_VALIDITY_DAYS:-365}
      # JWT 设备令牌签名密钥：置 AUTH_JWT_ENABLED=true 时必须显式配置，不得与平台 JWT_SECRET 复用
      AUTH_JWT_ENABLED: ${AUTH_JWT_ENABLED:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_TTL_SECONDS: ${AUTH_JWT_TTL_SECONDS:-3600}
      # 固件包持久化：backend 写入，frontend(nginx) 只读挂载对外托管
    volumes:
      - ota_firmware:/var/lib/mqtt/ota
      # T-25：CA 证书与私钥，路径由 AUTH_X509_CA_CERT / AUTH_X509_CA_KEY 指定（只读）
      - ./certs:/etc/mqtt/certs:ro
      # T-30 E1：结构化日志落盘卷。此前日志只进 docker json-file（20m x 5，容器重建即丢），
      # 现按天滚动保留 14 天，容器销毁后日志仍在，可直接挂载出来检索
      - backend_logs:/var/log/mqtt-cloud
    healthcheck:
      # 挂在 liveness（/health）而非 readiness：数据库或 Redis 抖动不应触发容器重启，
      # 积压与依赖故障由监控按 /health/ready 告警并人工介入（T-30 E3）
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mqtt-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  # 一次性初始化：通过 EMQX REST API 下发 HTTP 认证与授权源（可重复执行，幂等）
  emqx-init:
    image: curlimages/curl:8.8.0
    container_name: mqtt-emqx-init
    restart: "no"
    volumes:
      - ../scripts/emqx-init.sh:/emqx-init.sh:ro
    entrypoint: ["sh", "/emqx-init.sh"]
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN 必须在 .env 中配置}
      EMQX_DASHBOARD_USER: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # 授权结果缓存 TTL：决定禁用/停用后已连接会话收发被拒的最长收敛窗口
      ACL_CACHE_TTL: ${ACL_CACHE_TTL:-10s}
    depends_on:
      emqx:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - mqtt-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: mqtt-cloud-frontend:1.0.0
    container_name: mqtt-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # OTA 固件静态托管（T-22）：与 backend 共享命名卷，nginx 以只读方式对外提供下载
    volumes:
      - ota_firmware:/usr/share/nginx/html/firmware:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - mqtt-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  ota_firmware:
    driver: local
  # T-30 E1：后端结构化日志持久化，避免容器重建即丢
  backend_logs:
    driver: local

networks:
  mqtt-network:
    driver: bridge