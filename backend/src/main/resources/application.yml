spring:
  application:
    name: mqtt-cloud-backend

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mqtt_cloud?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

  # MQTT配置
  mqtt:
    host: ${MQTT_HOST:tcp://localhost:1883}
    username: ${MQTT_USERNAME:admin}
    password: ${MQTT_PASSWORD:public}
    clientId: ${MQTT_CLIENT_ID:mqtt_backend}
    timeout: ${MQTT_TIMEOUT:10}
    keepalive: ${MQTT_KEEPALIVE:60}
    reconnect: ${MQTT_RECONNECT:true}
    # 连接失败后的指数退避：1s 起，翻倍增长，上限 30s
    reconnect-initial-delay-ms: ${MQTT_RECONNECT_INITIAL_DELAY_MS:1000}
    reconnect-max-delay-ms: ${MQTT_RECONNECT_MAX_DELAY_MS:30000}
    # 已连接时的巡检间隔，用于兜底发现未被回调通知的断连
    connected-probe-interval-ms: ${MQTT_CONNECTED_PROBE_INTERVAL_MS:30000}
    clean-session: ${MQTT_CLEAN_SESSION:true}
    max-inflight: ${MQTT_MAX_INFLIGHT:100}
    # 共享订阅组名：多副本部署时同一组内的副本分摊消息，避免重复落库
    shared-subscription-group: ${MQTT_SHARED_GROUP:mqtt-backend}

  # 数据库迁移（schema 唯一来源）
  # baseline-on-migrate + baseline-version=1：存量库（已有表、无 history 表）
  # 基线记为 1 并跳过 V1，仅执行 V2+；全新库则从 V1 开始依次执行。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  # Jackson配置
  # 注意：Jackson 3 起 WRITE_DATES_AS_TIMESTAMPS 由 SerializationFeature 迁至 DateTimeFeature，
  # 且默认值改为 false（日期序列化为 ISO-8601 字符串），故不再需要显式关闭；
  # 且 spring.jackson.serialization.* 只能绑定 SerializationFeature 枚举，写旧名会导致启动失败。
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传（T-22 固件包）：放宽上传上限，须不小于 app.ota.max-file-size（默认 32MB）
  servlet:
    multipart:
      max-file-size: ${OTA_MAX_FILE_SIZE:33554432}
      max-request-size: ${OTA_MAX_REQUEST_SIZE:34603008}

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO
  mapper-locations: classpath*:com/mqtt/cloud/mapper/**/*.xml

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

# 应用配置
app:
  jwt:
    secret: ${JWT_SECRET:TXlNU1RDbG91ZENsb3VkU2VjcmV0S2V5MjAyNVlvdXJTZWNyZXRrZXlGb3JIT1BERVI=}
    expiration: ${JWT_EXPIRATION:604800000}
    refresh-expiration: ${JWT_REFRESH:2592000000}
  device:
    status-check-interval: 60000
    status-timeout: 300000
  # 接入访问控制（EMQX HTTP 回调）
  access-control:
    # false 时认证与授权回调一律放行，用于迁移期双轨运行
    enforce-auth: ${ACCESS_CONTROL_ENFORCE_AUTH:true}
    # 内部接口共享令牌，EMQX 与后端必须一致
    internal-token: ${INTERNAL_TOKEN:}
    # 后端自身连接 Broker 使用的平台账号密码
    platform-secret: ${PLATFORM_SECRET:}
    # 迁移期前端直连 Broker 的受限账号密码（配合 realtime.direct-frontend-enabled）
    frontend-secret: ${FRONTEND_SECRET:}
    # 认证元数据缓存 TTL（秒）；0 关闭缓存。主动失效未覆盖时，密钥重置后最长该时长内旧凭据仍可能通过认证
    cache-ttl-seconds: ${ACCESS_CONTROL_CACHE_TTL_SECONDS:60}
  realtime:
    # true 时保留 EMQX 直连受限账号供未升级前端过渡
    direct-frontend-enabled: ${DIRECT_FRONTEND_ENABLED:false}
    # SSE 连接超时（毫秒），0 表示不超时；默认 30 分钟，避免异常掉线的连接长期滞留
    stream-timeout-ms: ${STREAM_TIMEOUT_MS:1800000}
    # 服务端心跳间隔（毫秒），以注释帧穿透网关空闲超时并探测死连接；必须小于网关 proxy_read_timeout
    heartbeat-interval-ms: ${STREAM_HEARTBEAT_INTERVAL_MS:15000}
    # true：经 Redis Pub/Sub 跨副本广播（多副本必须为 true）；false：仅本副本内推送（单副本回退）
    broadcast-enabled: ${REALTIME_BROADCAST_ENABLED:false}
    broadcast-channel: ${REALTIME_BROADCAST_CHANNEL:mqtt:realtime:device-data}
  # EMQX 管理面（Dashboard REST API）：禁用 / 停用时踢掉在线连接，实现「禁用即切断」
  emqx:
    # API 根地址，容器网络内直连 EMQX，不经网关
    api-base-url: ${EMQX_API_BASE_URL:http://emqx:18083/api/v5}
    # 凭据必须与 emqx-init 下发认证/授权配置所用账号一致
    dashboard-user: ${EMQX_DASHBOARD_USER:admin}
    dashboard-password: ${EMQX_DASHBOARD_PASSWORD:public}
    # false 时不做踢线，仅依赖 EMQX 授权缓存 TTL 收敛已连接会话
    kick-enabled: ${EMQX_KICK_ENABLED:true}
  # 上行摄取管线：回调线程只入队，落库与下游分发在 worker 线程完成
  ingest:
    # false 时回退为回调线程同步落库（仅用于故障回滚）
    enabled: ${INGEST_ENABLED:true}
    # 单批最大条数
    batch-size: ${INGEST_BATCH_SIZE:500}
    # 攒批最长等待（毫秒），与 batch-size 先到者触发 flush
    flush-interval-ms: ${INGEST_FLUSH_INTERVAL_MS:200}
    # 单 worker 队列容量，总容量 = queue-capacity * worker-count
    queue-capacity: ${INGEST_QUEUE_CAPACITY:20000}
    # worker 数，同时决定 deviceKey 的路由分片数
    worker-count: ${INGEST_WORKER_COUNT:4}
    # 入队等待上限（毫秒），超时视为溢出
    offer-timeout-ms: ${INGEST_OFFER_TIMEOUT_MS:50}
    # 落库失败重试次数与退避基数（毫秒）
    max-attempts: ${INGEST_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${INGEST_RETRY_BACKOFF_MS:500}
    # 停机时排空队列的最长等待（毫秒）
    shutdown-drain-timeout-ms: ${INGEST_SHUTDOWN_DRAIN_TIMEOUT_MS:10000}
  # 物模型与上行解析（T-14）
  thing-model:
    # false 时整条解析链路退化为现状（只落原始消息），用于故障回滚
    interpret-enabled: ${THING_MODEL_INTERPRET_ENABLED:true}
    # 物模型定义缓存 TTL（秒）；0 关闭缓存。保存只失效本副本，多副本收敛窗口 = 该 TTL
    cache-ttl-seconds: ${THING_MODEL_CACHE_TTL_SECONDS:60}
    # 物模型 TSL 大小上限（字节），保存与导入共用
    max-size-bytes: ${THING_MODEL_MAX_SIZE_BYTES:262144}
  # 命令下发与服务调用（T-15）
  command:
    # 同步调用等待回执的超时（毫秒），超时置 TIMEOUT
    sync-timeout-ms: ${COMMAND_SYNC_TIMEOUT_MS:5000}
    # 同步等待的轮询间隔（毫秒）；多副本下回执可能落到其他副本，故轮询命令记录表而非进程内 Future
    poll-interval-ms: ${COMMAND_POLL_INTERVAL_MS:200}
    # 超时巡检间隔（毫秒），0 关闭；把长期停留 PENDING/SENT 的记录兜底置 TIMEOUT
    timeout-sweep-interval-ms: ${COMMAND_TIMEOUT_SWEEP_INTERVAL_MS:30000}
    # 异步命令判定超时的时长（毫秒），供巡检使用
    async-timeout-ms: ${COMMAND_ASYNC_TIMEOUT_MS:60000}
    # 命令参数 JSON 大小上限（字节），超限直接拒绝
    max-params-bytes: ${COMMAND_MAX_PARAMS_BYTES:16384}
  # 设备影子与离线补发（T-16）
  shadow:
    # 上线补发总开关；置 false 时离线期望值仍写 desired，但不再自动补发
    resend-enabled: ${SHADOW_RESEND_ENABLED:true}
    # 补发重试上限，达到该次数仍未成功则置 FAILED
    retry-max-attempts: ${SHADOW_RETRY_MAX_ATTEMPTS:5}
    # 指数退避基数（毫秒）
    retry-base-delay-ms: ${SHADOW_RETRY_BASE_DELAY_MS:5000}
    # 指数退避封顶（毫秒）
    retry-max-delay-ms: ${SHADOW_RETRY_MAX_DELAY_MS:300000}
    # 退避重试巡检间隔（毫秒），0 关闭
    retry-sweep-interval-ms: ${SHADOW_RETRY_SWEEP_INTERVAL_MS:30000}
    # 单轮巡检 / 单设备补发批量上限
    resend-batch-size: ${SHADOW_RESEND_BATCH_SIZE:200}
    # 影子 CAS 冲突重试次数；耗尽后记 WARN 并放弃本次合并
    cas-retry: ${SHADOW_CAS_RETRY:3}
    # QUEUED 过期时长（毫秒），0 表示不过期
    queue-ttl-ms: ${SHADOW_QUEUE_TTL_MS:0}
  # 告警中心（T-17）
  alert:
    # 告警评估总开关；置 false 时不评估，离线巡检也不注册
    enabled: ${ALERT_ENABLED:true}
    # 触发通知开关；置 false 时仍落库但不投递 alert.triggered
    notify-enabled: ${ALERT_NOTIFY_ENABLED:true}
    # 恢复通知开关；置 false 时仍置 RECOVERED 但不投递 alert.recovered
    recover-notify-enabled: ${ALERT_RECOVER_NOTIFY_ENABLED:true}
    # 全局默认抑制窗口（秒），规则未单独配置时使用
    suppress-window-seconds: ${ALERT_SUPPRESS_WINDOW_SECONDS:300}
    # 离线巡检间隔（毫秒），0 关闭
    sweep-interval-ms: ${ALERT_SWEEP_INTERVAL_MS:30000}
    # 单轮巡检规则 / 记录处理上限
    sweep-batch-size: ${ALERT_SWEEP_BATCH_SIZE:200}
  # 消息规则 / 规则引擎（T-19）
  rule:
    # 规则引擎总开关；置 false 时不做条件判定（既有告警与 Webhook 不受影响）
    enabled: ${RULE_ENABLED:true}
    # 单用户规则数上限
    max-rules-per-user: ${RULE_MAX_RULES_PER_USER:200}
    # 规则定义缓存 TTL（秒）；0 关闭缓存。保存只失效本副本，多副本收敛窗口 = 该 TTL
    cache-ttl-seconds: ${RULE_CACHE_TTL_SECONDS:60}
    # 动作执行线程池
    executor-core-size: ${RULE_EXECUTOR_CORE_SIZE:2}
    executor-max-size: ${RULE_EXECUTOR_MAX_SIZE:8}
    executor-queue-capacity: ${RULE_EXECUTOR_QUEUE_CAPACITY:500}
    # 失败重试上限，达到该次数仍未成功则置 FAILED
    retry-max-attempts: ${RULE_RETRY_MAX_ATTEMPTS:3}
    # 指数退避基数（毫秒）
    retry-base-delay-ms: ${RULE_RETRY_BASE_DELAY_MS:5000}
    # 指数退避封顶（毫秒）
    retry-max-delay-ms: ${RULE_RETRY_MAX_DELAY_MS:300000}
    # 重试巡检间隔（毫秒），0 关闭（同时关闭保留清理）
    sweep-interval-ms: ${RULE_SWEEP_INTERVAL_MS:30000}
    # 单轮巡检处理上限
    sweep-batch-size: ${RULE_SWEEP_BATCH_SIZE:200}
    # 执行记录保留天数（仅清理终态记录），0 表示不清理
    execution-retention-days: ${RULE_EXECUTION_RETENTION_DAYS:30}
    # 出站 HTTP 超时（毫秒）
    http-timeout-ms: ${RULE_HTTP_TIMEOUT_MS:5000}
    # 转发 HTTP 的 HMAC 签名密钥；为空时不下发 X-Signature 头
    http-secret: ${RULE_HTTP_SECRET:}
    # 动作配置 / 载荷模板大小上限（字节）
    max-payload-bytes: ${RULE_MAX_PAYLOAD_BYTES:16384}
    # 外部 MQTT 转发（出站到第三方 Broker，不经自有 EMQX）
    mqtt:
      # 置 false 时 FORWARD_MQTT 动作直接置 FAILED，其余动作不受影响
      enabled: ${RULE_MQTT_ENABLED:false}
      # 第三方 Broker 地址（tcp:// 或 ssl://）；enabled=true 时必填
      broker-url: ${RULE_MQTT_BROKER_URL:}
      client-id: ${RULE_MQTT_CLIENT_ID:mqtt-rule-forwarder}
      username: ${RULE_MQTT_USERNAME:}
      password: ${RULE_MQTT_PASSWORD:}
      # 缺省 QoS，规则未配置时使用
      qos: ${RULE_MQTT_QOS:1}
      keepalive: ${RULE_MQTT_KEEPALIVE:60}
      connect-timeout: ${RULE_MQTT_CONNECT_TIMEOUT:10}
  # 设备日志时间线（统一聚合 message / command / event / status）
  device-log:
    # 单页最大条数上限
    max-page-size: ${DEVICE_LOG_MAX_PAGE_SIZE:100}
    # 单次查询时间跨度上限（天）
    max-range-days: ${DEVICE_LOG_MAX_RANGE_DAYS:31}
  # 属性时序（T-21）：历史落库、聚合查询与保留清理
  property-history:
    # 是否写入属性历史（关闭后趋势图无新数据）
    enabled: ${PROPERTY_HISTORY_ENABLED:true}
    # 聚合查询时间窗跨度上限（天）
    max-range-days: ${PROPERTY_HISTORY_MAX_RANGE_DAYS:31}
    # 单次查询序列数上限（deviceIds × identifiers）
    max-series: ${PROPERTY_HISTORY_MAX_SERIES:20}
    # 单序列数据点上限（时间跨度 / 桶）
    max-points: ${PROPERTY_HISTORY_MAX_POINTS:500}
    # 历史保留天数（R5 门槛复核输入）
    retention-days: ${PROPERTY_HISTORY_RETENTION_DAYS:30}
    # 是否启用过期历史清理
    cleanup-enabled: ${PROPERTY_HISTORY_CLEANUP_ENABLED:true}
    # 清理巡检间隔（毫秒）
    cleanup-interval-ms: ${PROPERTY_HISTORY_CLEANUP_INTERVAL_MS:3600000}
    # 单批删除行数
    cleanup-batch-size: ${PROPERTY_HISTORY_CLEANUP_BATCH_SIZE:1000}
  # 可保存看板（T-21）
  dashboard:
    # 每用户看板数量上限
    max-count: ${DASHBOARD_MAX_COUNT:20}
    # 单看板面板数上限
    max-panels: ${DASHBOARD_MAX_PANELS:12}
  # OTA 固件升级（T-22）：固件上传、批次下发与进度回传
  ota:
    # 升级总开关；置 false 时不下发、不巡检（固件包上传与任务创建仍可用）
    enabled: ${OTA_ENABLED:true}
    # 固件包存储根目录（容器内路径，需可写）
    storage-dir: ${OTA_STORAGE_DIR:/var/lib/mqtt/ota}
    # 固件下载地址前缀；下发 url = {public-base-url}/{productId}/{version}/{fileName}
    public-base-url: ${OTA_PUBLIC_BASE_URL:http://localhost/firmware}
    # 单固件包大小上限（字节），与 spring.servlet.multipart.max-file-size 对齐
    max-file-size: ${OTA_MAX_FILE_SIZE:33554432}
    # 单任务目标设备数上限
    task-max-devices: ${OTA_TASK_MAX_DEVICES:500}
    # 下发巡检间隔（毫秒），0 关闭
    dispatch-interval-ms: ${OTA_DISPATCH_INTERVAL_MS:60000}
    # 单轮下发批量上限
    dispatch-batch-size: ${OTA_DISPATCH_BATCH_SIZE:200}
    # 任务超时时长（毫秒）；超过该时长仍无终态回传的记录置 TIMEOUT
    task-timeout-ms: ${OTA_TASK_TIMEOUT_MS:86400000}

  # 自动化 / 场景联动（T-23）
  scene:
    # 场景引擎总开关；置 false 时不做触发评估、定时巡检不注册（既有规则 / 告警不受影响）
    enabled: ${SCENE_ENABLED:true}
    # 单用户场景数上限
    max-scenes-per-user: ${SCENE_MAX_SCENES_PER_USER:100}
    # 单场景步骤数上限
    max-steps-per-scene: ${SCENE_MAX_STEPS_PER_SCENE:20}
    # 单场景条件项数上限
    max-conditions-per-scene: ${SCENE_MAX_CONDITIONS_PER_SCENE:10}
    # 单步骤目标设备数上限（同时受 DeviceBatchService.MAX_BATCH_SIZE=500 约束）
    max-target-devices: ${SCENE_MAX_TARGET_DEVICES:500}
    # 单步骤最大延时（秒）
    max-step-delay-seconds: ${SCENE_MAX_STEP_DELAY_SECONDS:86400}
    # 场景定义缓存 TTL（秒）；0 关闭缓存。保存只失效本副本，多副本收敛窗口 = 该 TTL
    cache-ttl-seconds: ${SCENE_CACHE_TTL_SECONDS:60}
    # 步骤执行线程池
    executor-core-size: ${SCENE_EXECUTOR_CORE_SIZE:2}
    executor-max-size: ${SCENE_EXECUTOR_MAX_SIZE:8}
    executor-queue-capacity: ${SCENE_EXECUTOR_QUEUE_CAPACITY:500}
    # 步骤失败重试上限，达到该次数仍未成功则中止后续步骤
    retry-max-attempts: ${SCENE_RETRY_MAX_ATTEMPTS:3}
    # 指数退避基数（毫秒）
    retry-base-delay-ms: ${SCENE_RETRY_BASE_DELAY_MS:5000}
    # 指数退避封顶（毫秒）
    retry-max-delay-ms: ${SCENE_RETRY_MAX_DELAY_MS:300000}
    # 延时与重试巡检间隔（毫秒），0 关闭（同时关闭卡死恢复与保留清理）；决定延时精度
    sweep-interval-ms: ${SCENE_SWEEP_INTERVAL_MS:1000}
    # 单轮巡检处理上限
    sweep-batch-size: ${SCENE_SWEEP_BATCH_SIZE:200}
    # 单步执行超时（毫秒）；超过该时长仍为 RUNNING 的步骤由巡检复位重试
    step-timeout-ms: ${SCENE_STEP_TIMEOUT_MS:300000}
    # 执行记录保留天数（仅清理终态记录），0 表示不清理
    execution-retention-days: ${SCENE_EXECUTION_RETENTION_DAYS:30}
    # 定时触发使用的时区
    timer-zone: ${SCENE_TIMER_ZONE:Asia/Shanghai}

# 日志配置
logging:
  level:
    com.mqtt.cloud: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.eclipse.paho: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点（Actuator + Micrometer）
# 依赖：spring-boot-starter-actuator、micrometer-registry-prometheus
# 访问控制见 SecurityConfig：/actuator/health 与 /actuator/prometheus 公开，
# 其余 /actuator/**（info、metrics）仅 ADMIN。
# show-details=when-authorized：匿名请求只返回 status，携带 ADMIN 凭证才返回依赖组件明细，
# 避免公开端点泄露数据库/Redis 连接细节。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
