<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #F5F5F5; color: #333; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #FFF; border: 1px solid #E0E0E0; padding: 24px; margin-bottom: 20px; }
        .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .header p { font-size: 13px; color: #666; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: #FFF; border: 1px solid #E0E0E0; padding: 24px; cursor: pointer; transition: all 0.2s; }
        .card:hover { border-color: #333; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .card p { font-size: 13px; color: #666; }
        .btn { padding: 8px 16px; border: none; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-outline { background: transparent; border: 1px solid #333; color: #333; }
        .section { background: #FFF; border: 1px solid #E0E0E0; padding: 24px; margin-bottom: 20px; }
        .section h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E0E0E0; font-size: 13px; }
        th { background: #F5F5F5; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>数据可视化</h1>
            <p>选择可视化方式查看记录数据</p>
            <a href="index.html" class="btn btn-outline" style="margin-top: 10px;">返回主页面</a>
        </div>

        <div class="grid">
            <div class="card" onclick="window.location.href='waveform-viewer.html'">
                <h3>波形图</h3>
                <p>查看6轴数据的实时波形变化</p>
            </div>
            <div class="card" onclick="window.location.href='statistics.html'">
                <h3>统计图表</h3>
                <p>查看数据分布和统计信息</p>
            </div>
            <div class="card" onclick="window.location.href='overview.html'">
                <h3>数据总览</h3>
                <p>查看所有记录的汇总信息</p>
            </div>
            <div class="card" onclick="window.location.href='comparison.html'">
                <h3>多文件对比</h3>
                <p>对比多个记录文件的数据差异</p>
            </div>
        </div>
    </div>
</body>
</html>
