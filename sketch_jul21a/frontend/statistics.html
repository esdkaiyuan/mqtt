<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Statistics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#F5F5F5;padding:20px}
.container{max-width:1400px;margin:0 auto}
.header{background:#FFF;border:1px solid #E0E0E0;padding:24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:600}
.section{background:#FFF;border:1px solid #E0E0E0;padding:24px;margin-bottom:20px}
.section h2{font-size:16px;font-weight:600;margin-bottom:16px}
.btn{padding:8px 16px;border:none;cursor:pointer;font-size:13px;text-decoration:none}
.btn-outline{background:transparent;border:1px solid #333;color:#333}
select{padding:8px 12px;border:1px solid #DDD;font-size:13px;min-width:300px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-box{border:1px solid #E0E0E0;padding:16px;background:#FFF}
.chart-box h3{font-size:14px;font-weight:600;margin-bottom:12px}
canvas{width:100%;height:250px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.info-item{padding:12px;background:#F9F9F9;border:1px solid #E0E0E0}
.info-item .label{font-size:12px;color:#666}
.info-item .value{font-size:18px;font-weight:600;color:#333}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Statistics Analysis</h1>
<a href="visualization.html" class="btn btn-outline">Back</a>
</div>

<div class="section">
<h2>Select Recording File</h2>
<select id="fileSelect" onchange="loadRecording()">
<option value="">Please select a file</option>
</select>
</div>

<div class="section" id="summarySection" style="display:none">
<h2>Summary</h2>
<div class="info-grid">
<div class="info-item"><div class="label">Total Samples</div><div class="value" id="sTotal">0</div></div>
<div class="info-item"><div class="label">Duration (s)</div><div class="value" id="sDuration">0</div></div>
<div class="info-item"><div class="label">Sample Rate</div><div class="value" id="sRate">100 Hz</div></div>
<div class="info-item"><div class="label">AX Range (g)</div><div class="value" id="sAxRange">-</div></div>
<div class="info-item"><div class="label">AY Range (g)</div><div class="value" id="sAyRange">-</div></div>
<div class="info-item"><div class="label">AZ Range (g)</div><div class="value" id="sAzRange">-</div></div>
</div>
</div>

<div class="chart-grid" id="chartsArea" style="display:none">
<div class="section">
<h2>Accel Magnitude</h2>
<div class="chart-box"><canvas id="magChart"></canvas></div>
</div>
<div class="section">
<h2>Box Plot Data</h2>
<div class="chart-box"><canvas id="boxChart"></canvas></div>
</div>
</div>

<div class="section" id="rmsSection" style="display:none">
<h2>RMS Values</h2>
<div class="chart-box"><canvas id="rmsChart"></canvas></div>
</div>
</div>

<script>
const API='http://localhost:8004';
let charts={};

async function loadFileList(){
const res=await fetch(API+'/api/recordings');
const data=await res.json();
const select=document.getElementById('fileSelect');
data.recordings.forEach(rec=>{
const opt=document.createElement('option');
opt.value=rec.filename;
opt.textContent=rec.filename+' ('+rec.record_time+')';
select.appendChild(opt);
});
}

async function loadRecording(){
const filename=document.getElementById('fileSelect').value;
if(!filename){hideAll();return;}
const res=await fetch(API+'/api/recordings/'+filename);
const csv=await res.text();
const data=parseCSV(csv);
if(!data.length){alert('No data');return;}
showStats(data);
}

function parseCSV(csv){
const lines=csv.trim().split('\n');
const data=[];
for(let i=1;i<lines.length;i++){
if(lines[i]){
const c=lines[i].split(',');
data.push({ax:+c[3],ay:+c[4],az:+c[5],gx:+c[6],gy:+c[7],gz:+c[8]});
}
}
return data;
}

function hideAll(){
document.getElementById('summarySection').style.display='none';
document.getElementById('chartsArea').style.display='none';
document.getElementById('rmsSection').style.display='none';
}

function showStats(data){
document.getElementById('summarySection').style.display='block';
document.getElementById('chartsArea').style.display='grid';
document.getElementById('rmsSection').style.display='block';

const n=data.length;
document.getElementById('sTotal').textContent=n;
document.getElementById('sDuration').textContent=(n/100).toFixed(1);

const rng=(arr)=>{const mn=Math.min(...arr);const mx=Math.max(...arr);return mn.toFixed(2)+' ~ '+mx.toFixed(2);};
document.getElementById('sAxRange').textContent=rng(data.map(d=>d.ax));
document.getElementById('sAyRange').textContent=rng(data.map(d=>d.ay));
document.getElementById('sAzRange').textContent=rng(data.map(d=>d.az));

drawMagnitude(data);
drawBox(data);
drawRMS(data);
}

function drawMagnitude(data){
const labels=data.map((_,i)=>i);
const magnitudes=data.map(d=>Math.sqrt(d.ax*d.ax+d.ay*d.ay+d.az*d.az));
if(charts.mag)charts.mag.destroy();
charts.mag=new Chart(document.getElementById('magChart'),{
type:'line',
data:{labels,datasets:[{label:'|a|',data:magnitudes,borderColor:'#333',borderWidth:1,pointRadius:0,tension:0.1,fill:true,backgroundColor:'#33333310'}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'Sample'}},y:{title:{display:true,text:'g'}}}}
});
}

function drawBox(data){
const keys=['ax','ay','az'];
const mins=keys.map(k=>Math.min(...data.map(d=>d[k])));
const maxs=keys.map(k=>Math.max(...data.map(d=>d[k])));
const avgs=keys.map(k=>data.reduce((s,d)=>s+d[k],0)/data.length);

const minsG=['gx','gy','gz'].map(k=>Math.min(...data.map(d=>d[k])));
const maxsG=['gx','gy','gz'].map(k=>Math.max(...data.map(d=>d[k])));
const avgsG=['gx','gy','gz'].map(k=>data.reduce((s,d)=>s+d[k],0)/data.length);

if(charts.box)charts.box.destroy();
charts.box=new Chart(document.getElementById('boxChart'),{
type:'bar',
data:{
labels:['AX','AY','AZ','GX','GY','GZ'],
datasets:[
{label:'Min',data:[...mins,...minsG],backgroundColor:'#3498DB40'},
{label:'Avg',data:[...avgs,...avgsG],backgroundColor:'#2ECC7180'},
{label:'Max',data:[...maxs,...maxsG],backgroundColor:'#E74C3C40'}
]
},
options:{responsive:true,maintainAspectRatio:false,scales:{y:{title:{display:true,text:'Value'}}}}
});
}

function drawRMS(data){
const windowSize=10;
const rmsValues=[];
for(let i=0;i<data.length-windowSize;i++){
const window=data.slice(i,i+windowSize);
const sum=window.reduce((s,d)=>s+d.ax*d.ax+d.ay*d.ay+d.az*d.az,0);
rmsValues.push(Math.sqrt(sum/windowSize));
}

if(charts.rms)charts.rms.destroy();
charts.rms=new Chart(document.getElementById('rmsChart'),{
type:'line',
data:{labels:rmsValues.map((_,i)=>i),datasets:[{label:'RMS Accel',data:rmsValues,borderColor:'#9B59B6',borderWidth:1,pointRadius:0,tension:0.1,fill:true,backgroundColor:'#9B59B610'}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'Window'}},y:{title:{display:true,text:'g RMS'}}}}
});
}

loadFileList();
</script>
</body>
</html>
