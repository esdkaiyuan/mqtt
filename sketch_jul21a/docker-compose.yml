services:
  postgres:
    image: postgres:15-alpine
    container_name: fall_detection_db
    environment:
      POSTGRES_DB: fall_detection
      POSTGRES_USER: fall_user
      POSTGRES_PASSWORD: fall_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fall_detection_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fall_user -d fall_detection"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fall_detection_backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # asyncpg driver is required by the async SQLAlchemy engine
      DATABASE_URL: postgresql+asyncpg://fall_user:fall_password@postgres:5432/fall_detection
      DATABASE_URL_SYNC: postgresql://fall_user:fall_password@postgres:5432/fall_detection
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      PYTHONUNBUFFERED: "1"
    networks:
      - fall_detection_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fall_detection_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fall_detection_network
    restart: unless-stopped

networks:
  fall_detection_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local