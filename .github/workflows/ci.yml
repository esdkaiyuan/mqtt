name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消仍在排队的旧运行，避免重复占用 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 阶段一：后端单元测试、架构约束与打包
  # ------------------------------------------------------------------
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    # MqttCloudApplicationTests 是全上下文 @SpringBootTest，Flyway 会真实执行
    # db/migration 下的建表脚本（baseline-on-migrate），因此必须挂一个可用的 MySQL。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: mqtt_cloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: root_password
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # loadtest 组由 pom.xml 的 <excludedGroups> 默认排除，无需额外参数；
      # verify 阶段同时执行 archunit 分层约束（LayeringRulesTest）与打包。
      - name: 单元测试与打包
        working-directory: backend
        run: mvn -B verify

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # 阶段二：前端 lint、单元测试与生产构建
  # ------------------------------------------------------------------
  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 代码检查
        working-directory: frontend
        run: npm run lint

      - name: 单元测试
        working-directory: frontend
        run: npm run test

      - name: 生产构建
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------------
  # 阶段三：整套服务端到端集成测试
  # ------------------------------------------------------------------
  e2e:
    name: 端到端集成测试
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml 对 PLATFORM_SECRET / JWT_SECRET / INTERNAL_TOKEN 使用 ${VAR:?}
      # 强校验，缺一个就会拒绝启动；deploy.sh 会从 .env.example 生成 .env 并补齐随机密钥，
      # 随后构建并启动全套服务、等待后端健康就绪，再执行 health-check.sh。
      - name: 构建并启动整套服务
        run: bash scripts/deploy.sh

      # scripts/api-test.ps1 通过 curl.exe 发请求（Windows 命名），
      # 在 Linux runner 上补一个同名软链，避免为适配 CI 改动被测脚本本身。
      - name: 准备 curl.exe 入口
        run: sudo ln -sf "$(command -v curl)" /usr/local/bin/curl.exe

      # 后端不发布宿主机端口（多副本下会端口冲突），只能经 nginx 网关访问；
      # 默认账号 admin/admin123 由 db/migration/V1__baseline.sql 播种。
      # -BehindGateway：网关对 /internal/emqx/* 是 deny all，无令牌请求在网关层即 403（不是 401）。
      # -SelfBase：webhook 正向投递由后端容器发起，回环地址须指向后端自身（8080）而非网关。
      - name: 运行接口集成测试
        run: >-
          pwsh -NoLogo -NonInteractive -File scripts/api-test.ps1
          -Base http://127.0.0.1/api
          -BehindGateway
          -SelfBase http://localhost:8080/api

      - name: 失败时导出容器日志
        if: failure()
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml ps || true
          docker compose --env-file .env -f docker/docker-compose.yml logs --tail=200 || true

      - name: 停止并清理容器
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml down -v || true
